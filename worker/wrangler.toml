# Repo path: worker/wrangler.toml
# Record of the Worker's settings. Chef deploys by pasting worker.js into the
# Cloudflare dashboard (no Wrangler CLI needed). If Wrangler is ever used instead,
# this file is what it reads: `wrangler deploy` run from the worker/ folder.
# Secrets are NOT stored here. They are added in Cloudflare (Settings > Variables and Secrets).
name = "aurion-bot"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Observability (stored logs) is OFF for this Worker and for all of Chef's Workers, and stays off.
[observability]
enabled = false

# Cron Triggers are added in the Cloudflare dashboard (Settings > Trigger Events), not from this file.
# Record of the 8 triggers (UTC): 30 8, 30 7, 0 11, 0 10, 0 14, 0 13, 55 20, 55 19 (each followed by * * *)
